<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | EducationHub</title>

    <link rel="stylesheet" href="css/auth.css">

</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-logo">

                <div class="logo-icon">
                    EH
                </div>

                <h1>
                    Education<span>Hub</span>
                </h1>

            </div>

            <h2>Welcome Back 👋</h2>

            <p class="auth-subtitle">
                Login to continue your learning journey.
            </p>

            <form id="loginForm">

                <div class="input-group">

                    <label for="loginEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="loginPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-btn"
                >
                    Login
                </button>


                <p
                    id="loginMessage"
                    class="message"
                ></p>

            </form>


            <div class="auth-footer">

                <p>

                    Don't have an account?

                    <a href="register.html">
                        Create Account
                    </a>

                </p>

            </div>

        </div>

    </div>


    <script src="js/auth.js"></script>

</body>

</html>
